<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juego L5 Barcelona</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-container">
    <h1>🎮 Viaje por la L5 de Barcelona</h1>
    <div id="station-container">
      <img id="station-img" src="images/start.jpg" alt="Estación">
      <h2 id="station-name">Cornellà Centre</h2>
      <p id="event-text">Presiona "Avanzar" para comenzar el viaje.</p>
    </div>
    <p id="points">Puntos: 0</p>
    <button onclick="nextStation()">Avanzar 🚇</button>
    <audio id="station-music" src="" autoplay></audio>
  </div>
  <script src="script.js"></script>
</body>
</html>
